<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demo · Opción C · Estudio AE</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css">
<style>
:root{--bg:#0f1115;--surface:#181b21;--text:#f4f5f7;--muted:#a9b0bc;--border:#2a2f38;--border-strong:#3a3f49;--pri:#ff0061;--pri-ink:#ff8fb4;--pri-text:#1a0009;
  --chip-bg:#2a1320;--chip-text:#ffb3cd;--track:#262a33;--input-bg:#12151a;--ok:#8fd19e;--ok-bg:#15291c;--warn:#ffb3cd;--warn-bg:#2a1320;--ai-bg:#2d2547;--ai-text:#ece4ff;
  --radius:24px;--btn-radius:999px;--font-body:'Fira Sans',system-ui,sans-serif;--font-display:'Bricolage Grotesque',system-ui,sans-serif}
.c-top{min-height:64px;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:1px solid #22262e;position:sticky;top:0;z-index:20;background:#0f1115}
.c-brand{border:0;background:none;color:#f4f5f7;font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700;cursor:pointer;padding:0}
.c-top nav button{border:0;background:none;color:#a9b0bc;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer}
.c-top nav button.on{color:#fff;background:#1b1e24}
.c-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#a9b0bc}
.c-right img{height:24px}
.c-av{width:36px;height:36px;border-radius:50%;background:#ff0061;color:#1a0009;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.c-focus{min-height:calc(100vh - 64px);display:grid;grid-template-columns:92px minmax(0,1fr) 360px}
.c-bar{display:flex;align-items:center;gap:14px;padding:0 24px;min-height:56px;border-bottom:1px solid #22262e;grid-column:1/-1}
.c-exit{border:0;background:none;color:#a9b0bc;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:0}
.c-exit svg{width:18px;height:18px}
.c-seg{margin-left:auto;display:flex;gap:6px;align-items:center}
.c-seg span{width:64px;height:8px;border-radius:4px;background:#262a33;overflow:hidden}
.c-seg span i{display:block;height:100%;background:#ff0061;transition:width .4s}
.c-rail{border-right:1px solid #22262e;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0}
.c-rail button{width:54px;height:54px;border-radius:16px;border:0;background:#1b1e24;color:#6b7280;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:20px}
.c-rail button.ok{background:#ff0061;color:#1a0009}
.c-rail button.cur{background:#2a1320;border:3px solid #ff0061;color:#fff}
.c-rail button.book{margin-top:auto;color:#c3c8d1}
.c-rail svg{width:22px;height:22px}
.c-main{padding:28px 40px 140px;display:flex;flex-direction:column;gap:18px;min-width:0}
.c-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#a9b0bc;font-size:14px}
.c-main .dv-h1{font-size:clamp(28px,3.4vw,42px);letter-spacing:-1px}
.c-nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:18px;border-top:1px solid #22262e}
.c-side{border-left:1px solid #22262e;padding:22px;display:flex;flex-direction:column;gap:16px}
.c-ai{background:#1d1830;border-color:#3a2f5c}
.c-ai .dv-h2{color:#d9c6ff;display:inline-flex;gap:8px;align-items:center}
.c-ai .dv-btn{background:transparent;border-color:#54467f;color:#e3d6ff}
.dv-player{background:#0b0c10;border:1px solid #2a2f38}
.dv-cert-in h1,.dv-cert-in h2{color:#1d2125}
@media (max-width:1100px){.c-focus{grid-template-columns:72px minmax(0,1fr)}.c-side{grid-column:2;border-left:0;padding:0 40px 140px}.c-main{padding-bottom:24px}.c-rail button{width:46px;height:46px}.c-right span,.c-right img{display:none}}
@media (max-width:640px){.c-focus{grid-template-columns:1fr}.c-rail{flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid #22262e;padding:12px}.c-rail button.book{margin:0}.c-side{grid-column:1;padding:0 20px 160px}.c-main{padding:22px 20px}.c-seg span{width:34px}}
@media (max-width:640px){.c-top{padding:0 14px;gap:10px}.c-brand{font-size:17px}.c-bar{padding:0 14px;gap:10px}.c-bar>span{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="dv-toast-host"></div>
<template id="tpl-portada">

<div style="width: 1440px; height: 900px; box-sizing: border-box; padding: 28px 40px; display: flex; flex-direction: column; gap: 20px; background: #0f1115; color: #f4f5f7; font-family: 'Fira Sans', system-ui, sans-serif">

  <header style="display: flex; align-items: center; gap: 18px">
    <div style="width: 150px; height: 40px; border: 1.5px dashed #5b6370; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #a9b0bc">[Logo ADECOPRIA]</div>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">Campus ADECOPRIA</span>
    <nav style="display: flex; gap: 26px; margin-left: 28px; font-size: 15px; font-weight: 500">
      <a href="#" data-act="soon" style="color: #f4f5f7">Formaciones</a>
      <a href="#" data-act="soon" style="color: #a9b0bc">Sesiones en vivo</a>
      <a href="#" data-act="soon" style="color: #a9b0bc">Ayuda</a>
    </nav>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 12px; color: #a9b0bc">
      <span>Operado por</span>
      <img src="../logo-white.png" alt="Grupo AE Advanced Education" style="height: 26px; width: auto">
    </div>
  </header>

  <div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: minmax(0, 1.35fr) minmax(0, 1fr); gap: 16px">

    <section style="grid-column: span 8; box-sizing: border-box; padding: 40px 44px; border-radius: 28px; background: #181b21; border: 1px solid #2a2f38; display: flex; flex-direction: column; justify-content: space-between">
      <span style="align-self: flex-start; padding: 7px 14px; border-radius: 999px; background: #2a1320; color: #ffb3cd; font-size: 13px; font-weight: 600">Formación Continua Especializada · SENA 2026</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 72px; line-height: 0.98; font-weight: 800; letter-spacing: -2.5px">Aprende enfocado.<br><span style="color: #ff0061">En vivo.</span> Con IA<br>a tu lado.</h1>
      <p style="margin: 0; font-size: 18px; line-height: 1.55; color: #c3c8d1; max-width: 560px">Un módulo a la vez, sin distracciones. Clases por Meet, grabaciones siempre disponibles y un asistente que te resume y explica cada tema.</p>
    </section>

    <section style="grid-column: span 4; grid-row: span 2; box-sizing: border-box; padding: 36px 32px; border-radius: 28px; background: #f4f5f7; color: #0f1115; display: flex; flex-direction: column; gap: 16px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.6px">Entra a tu estudio</span>
      <span style="font-size: 15px; color: #4a515c; margin-top: -6px">Retoma justo donde lo dejaste.</span>
      <button type="button" data-act="google" style="height: 52px; display: flex; align-items: center; justify-content: center; gap: 12px; background: #ffffff; border: 1px solid #747775; border-radius: 999px; font-family: inherit; font-size: 15.5px; font-weight: 600; color: #1f1f1f; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
        Continuar con Google
      </button>
      <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #4a515c"><span style="flex-grow: 1; height: 1px; background: #cfd3da"></span>o<span style="flex-grow: 1; height: 1px; background: #cfd3da"></span></div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Número de documento
        <input type="text" placeholder="Ej. 1023456789" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #b9bec7; border-radius: 14px; font-family: inherit; font-size: 16px; background: #ffffff">
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Contraseña
        <input type="password" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #b9bec7; border-radius: 14px; font-family: inherit; font-size: 16px; background: #ffffff">
      </label>
      <button type="button" data-act="login" style="height: 54px; border: none; border-radius: 999px; background: #0f1115; color: #ffffff; font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer">Ingresar</button>
      <a href="#" data-act="soon" style="align-self: center; font-size: 14px; font-weight: 600; color: #b8004a">¿Olvidaste tu contraseña?</a>
      <p style="margin: auto 0 0; font-size: 12.5px; line-height: 1.5; color: #4a515c">En tu primer ingreso aceptarás la política de tratamiento de datos, la autorización de uso de imagen y la declaración de gratuidad.</p>
    </section>

    <section style="grid-column: span 3; box-sizing: border-box; padding: 24px; border-radius: 24px; background: #181b21; border: 1px solid #2a2f38; display: flex; flex-direction: column; gap: 14px">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700">Un módulo a la vez</span>
      <div style="display: flex; gap: 10px">
        <span style="width: 44px; height: 44px; border-radius: 14px; background: #ff0061; display: flex; align-items: center; justify-content: center; font-weight: 700">1</span>
        <span style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 14px; border: 2px solid #ff0061; display: flex; align-items: center; justify-content: center; font-weight: 700">2</span>
        <span style="width: 44px; height: 44px; border-radius: 14px; background: #262a33; color: #7d8594; display: flex; align-items: center; justify-content: center; font-weight: 700">3</span>
        <span style="width: 44px; height: 44px; border-radius: 14px; background: #262a33; color: #7d8594; display: flex; align-items: center; justify-content: center; font-weight: 700">4</span>
      </div>
      <span style="font-size: 14px; line-height: 1.5; color: #a9b0bc">Cada módulo se abre al terminar el anterior.</span>
    </section>

    <section style="grid-column: span 2; box-sizing: border-box; padding: 24px; border-radius: 24px; background: #ff0061; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; line-height: 1.1; color: #1a0009">Clases en vivo por Meet</span>
    </section>

    <section style="grid-column: span 3; box-sizing: border-box; padding: 24px; border-radius: 24px; background: #1d1830; border: 1px solid #3a2f5c; display: flex; flex-direction: column; gap: 12px">
      <span style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Bricolage Grotesque', sans-serif; font-size: 19px; font-weight: 700; color: #d9c6ff"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>Asistente con IA</span>
      <span style="align-self: flex-end; max-width: 220px; padding: 10px 14px; border-radius: 16px 16px 4px 16px; background: #2d2547; font-size: 13.5px; line-height: 1.4; color: #ece4ff">Resúmeme el Módulo 2 en 5 ideas</span>
      <span style="max-width: 240px; padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: #262a33; font-size: 13.5px; line-height: 1.4; color: #c3c8d1">Claro. Estas son las ideas clave de [tema]…</span>
    </section>
  </div>

  <footer style="display: flex; align-items: center; gap: 26px; font-size: 13.5px; color: #a9b0bc">
    <span style="font-weight: 600; color: #c3c8d1">CAU · [correo CAU] · [teléfono]</span>
    <a href="#" data-act="soon">Política de datos</a>
    <a href="#" data-act="soon">Manual de usuario</a>
    <div style="margin-left: auto; height: 36px; padding: 0 14px; border: 1.5px dashed #5b6370; border-radius: 8px; display: flex; align-items: center; font-size: 12px; font-weight: 600; color: #a9b0bc">[Cobranding SENA · pendiente de aprobación]</div>
  </footer>
</div>
</template>
<script>
window.THEME = {
  id: 'c', name: 'Opción C · Estudio AE', activityView: 'curso', inlineAI: true, hideActNav: true,
  afterComplete: (m, a, c) => c.nextAfter({ m, a }),   // flujo continuo: siguiente lección
  chrome: (c, inner) => c.S.view === 'curso' ? inner : `<header class="c-top"><span class="dv-ph">[Logo ADECOPRIA]</span><button class="c-brand" data-act="go" data-to="inicio">Campus ADECOPRIA</button>
    <nav><button data-act="go" data-to="inicio" class="${c.S.view === 'inicio' ? 'on' : ''}">Mis formaciones</button><button data-act="soon">Ayuda</button></nav>
    <div class="c-right"><span>Operado por</span><img src="../logo-white.png" alt="Grupo AE Advanced Education"><span class="c-av">${c.U.nombres[0]}${c.U.apellidos[0]}</span></div></header><main>${inner}</main>`,
  views: {
    curso: c => {
      const { S, C, ICON } = c, pct = c.progress(), done = c.allDone();
      const cur = S.cur || (done ? null : c.firstPending());
      const seg = C.modules.map((mo, i) => `<span title="Módulo ${i + 1}"><i style="width:${c.modCount(i) / mo.acts.length * 100}%"></i></span>`).join('');
      const rail = C.modules.map((mo, i) => { const cls = c.modDone(i) ? 'ok' : c.unlocked(i) ? 'cur' : '';
        return `<button class="${cls}" data-act="openModule" data-m="${i}" aria-label="Módulo ${i + 1}: ${mo.title}${cls === 'ok' ? ', completado' : cls ? ', en curso' : ', bloqueado'}">${cls === 'ok' ? ICON.check : cls ? i + 1 : ICON.lock}</button>`; }).join('');
      let main;
      if (!cur) main = `<div class="dv-celebrate">${ICON.award}</div><h1 class="dv-h1">Formación culminada</h1><p style="margin:0;color:#c3c8d1">Completaste los ${C.modules.length} módulos. Tu constancia está lista.</p><div class="dv-row"><button class="dv-btn dv-btn-pri" data-act="cert">${ICON.award} Ver certificado</button></div>`;
      else { const mo = C.modules[cur.m], p = c.prevBefore(cur), n = c.nextAfter(cur);
        main = `<div class="c-meta"><span>Módulo ${cur.m + 1} · ${mo.title}</span><span>·</span><span>Lección ${cur.a + 1} de ${mo.acts.length}</span><span class="dv-chip" style="margin-left:auto">${ICON.clock} ${c.daysLeft(cur.m)} días hábiles para terminar el módulo</span></div>
          ${c.activity(cur.m, cur.a)}
          <div class="c-nav">${p ? `<button class="dv-btn" data-act="prev">${ICON.left} Anterior</button>` : ''}${n && c.isDone(cur.m, cur.a) ? `<button class="dv-btn dv-btn-pri" style="margin-left:auto" data-act="next">Siguiente lección ${ICON.right}</button>` : `<span class="dv-muted" style="margin-left:auto;font-size:14px">${c.isDone(cur.m, cur.a) ? '' : 'Completa esta lección para avanzar.'}</span>`}</div>`; }
      const ai = S.aiInline;
      return `<div class="c-focus"><div class="c-bar"><button class="c-exit" data-act="go" data-to="inicio">${ICON.left} Salir del modo enfoque</button><span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700">${C.name}</span>
          <div class="c-seg" aria-label="Avance ${pct}%">${seg}<b style="margin-left:6px;color:#c3c8d1">${pct}%</b></div></div>
        <nav class="c-rail" aria-label="Módulos">${rail}<button class="book" data-act="about" aria-label="Sobre la formación">${ICON.book}</button></nav>
        <main class="c-main">${main}</main>
        <aside class="c-side">
          <div class="dv-card dv-stack c-ai"><span class="dv-h2">${ICON.spark} Asistente con IA</span>
            ${ai ? `<div id="ia-out" class="dv-ia" data-text="${c.esc(ai.text)}"></div>` : '<p class="dv-muted" style="margin:0">Pide un resumen de la lección o una explicación con un ejemplo de tu trabajo.</p>'}
            <div class="dv-row"><button class="dv-btn" data-act="ai" data-kind="resumen">Resumir</button><button class="dv-btn" data-act="ai" data-kind="explicar">Explicar</button></div>
            <span style="font-size:12.5px;color:#a99fc7">Respuestas de ejemplo. La IA apoya tu estudio: no califica ni reemplaza al capacitador.</span></div>
          <div class="dv-card dv-stack"><span class="dv-kicker">Próxima sesión en vivo</span><span class="dv-h2">Hora de dudas con el capacitador</span><span class="dv-muted">${c.fmt(c.liveDate())} · 6:00 p. m. · Google Meet</span>
            <button class="dv-btn dv-btn-pri" data-act="live">${ICON.video} ${S.live ? 'Asistencia registrada' : 'Unirme'}</button></div>
          ${done ? `<button class="dv-btn dv-btn-pri" data-act="cert">${ICON.award} Ver certificado</button>` : ''}
        </aside></div>`;
    }
  }
};
</script>
<script src="demo.js"></script>
</body>
</html>
