<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demo · Opción C · Estudio AE</title>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css">
<style>
/* Paleta FCE 2026: azul del programa + verde SENA; tipografía Work Sans (instructivo de imagen DSNFT-0001-FCE-2026) */
:root{--bg:#f6f6f6;--surface:#ffffff;--text:#1d2125;--muted:#5b6570;--border:#e3e6ea;--border-strong:#b9c0c8;--pri:#0b51d7;--pri-ink:#0b51d7;--pri-text:#ffffff;
  --chip-bg:#e7eefc;--chip-text:#0b3b9c;--track:#e9edf2;--input-bg:#ffffff;--ok:#007832;--ok-bg:#e9f6e2;--warn:#a50e0e;--warn-bg:#fce8e6;--ai-bg:#fdeaa8;--ai-text:#3c2a00;
  --radius:24px;--btn-radius:999px;--font-body:'Work Sans',system-ui,sans-serif;--font-display:'Work Sans',system-ui,sans-serif}
.dv-h1,.dv-h2{color:#00304d}
body:has(#fx){background:#03307c}   /* portada: sin franja gris bajo el fondo azul */
.c-top{min-height:72px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid #e3e6ea;position:sticky;top:0;z-index:20;background:#ffffff}
.c-brand{border:0;background:none;padding:0;cursor:pointer;display:flex}
.c-brand img{height:40px;width:auto}
.c-top nav button{border:0;background:none;color:#5b6570;font-weight:600;padding:10px 12px;border-radius:10px;cursor:pointer}
.c-top nav button.on{color:#0b3b9c;background:#e7eefc}
.c-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.c-right .sena{height:46px}.c-right .ade{height:34px}.c-right .gae{height:22px}
.c-sep{width:1px;height:36px;background:#c9ced6}
.c-av{width:36px;height:36px;border-radius:50%;background:#e7eefc;color:#0b3b9c;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.c-strip{position:sticky;bottom:0;z-index:15;display:flex;align-items:center;gap:14px;padding:8px 24px;background:#ffffff;border-top:1px solid #e3e6ea;font-size:12.5px;font-weight:600;line-height:1.35;color:#00304d}
.c-strip .fc{height:18px}.c-strip .m25{height:30px;margin-left:auto}
.c-focus{min-height:calc(100vh - 48px);display:grid;grid-template-columns:92px minmax(0,1fr) 360px}
.c-bar{display:flex;align-items:center;gap:14px;padding:0 24px;min-height:64px;border-bottom:1px solid #e3e6ea;grid-column:1/-1;background:#ffffff}
.c-bar .c-fce{height:34px}.c-name{font-weight:700;color:#00304d;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.c-logos{display:flex;align-items:center;gap:12px}.c-bar .c-sena{height:42px}.c-bar .ade{height:30px}.c-bar .gae{height:20px}
.c-exit{border:0;background:none;color:#5b6570;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;padding:0}
.c-exit svg{width:18px;height:18px}
.c-seg{margin-left:auto;display:flex;gap:6px;align-items:center}
.c-seg span{width:48px;height:8px;border-radius:4px;background:#e9edf2;overflow:hidden}
.c-seg span i{display:block;height:100%;background:#0b51d7;transition:width .4s}
.c-rail{border-right:1px solid #e3e6ea;background:#ffffff;display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 0}
.c-rail button{width:54px;height:54px;border-radius:16px;border:0;background:#eef1f4;color:#6b7480;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;font-weight:800;font-size:20px}
.c-rail button.ok{background:#0b51d7;color:#ffffff}
.c-rail button.cur{background:#e7eefc;border:3px solid #0b51d7;color:#0b3b9c}
.c-rail button.book{margin-top:auto;color:#3c4043}
.c-rail svg{width:22px;height:22px}
.c-main{padding:28px 40px 60px;display:flex;flex-direction:column;gap:18px;min-width:0}
.c-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#5b6570;font-size:14px}
.c-main .dv-h1{font-size:clamp(28px,3.4vw,40px);letter-spacing:-1px}
.c-nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:18px;border-top:1px solid #e3e6ea}
.c-side{border-left:1px solid #e3e6ea;background:#ffffff;padding:22px;display:flex;flex-direction:column;gap:16px}
.c-ai{background:#fff8dc;border-color:#f5dd8a}
.c-ai .dv-h2{color:#5c3d00;display:inline-flex;gap:8px;align-items:center}
.c-ai .dv-btn{background:transparent;border-color:#e0c26a;color:#5c3d00}
.dv-player{background:#03307c;border:1px solid #e3e6ea}
.dv-cert-in h1,.dv-cert-in h2{color:#1d2125}
@media (max-width:1100px){.c-focus{grid-template-columns:72px minmax(0,1fr)}.c-side{grid-column:2;border-left:0;padding:0 40px 60px}.c-main{padding-bottom:24px}.c-rail button{width:46px;height:46px}.c-name{display:none}}
@media (max-width:640px){.c-focus{grid-template-columns:1fr}.c-rail{flex-direction:row;justify-content:center;border-right:0;border-bottom:1px solid #e3e6ea;padding:12px}.c-rail button.book{margin:0}.c-side{grid-column:1;padding:0 20px 90px}.c-main{padding:22px 20px}.c-seg span{width:24px}}
@media (max-width:640px){.c-top{padding:0 12px;gap:10px;min-height:60px}.c-brand img{height:28px}.c-right{gap:8px}.c-right .sena{height:34px}.c-right .ade{height:24px}.c-sep{height:26px}
  .c-top{flex-wrap:wrap;padding:8px 12px}.c-right{order:3;width:100%;margin-left:0}.c-right .gae{height:16px}.c-av{margin-left:auto}
  .c-bar{flex-wrap:wrap;padding:8px 12px;gap:8px}.c-exit .t{display:none}.c-bar .c-fce{height:24px}.c-logos{order:3;width:100%;gap:10px}.c-bar .c-sena{height:30px}.c-bar .ade{height:22px}.c-bar .gae{height:15px}
  .c-strip{padding:6px 12px;font-size:11px}.c-strip .fc,.c-strip .m25,.c-strip .c-sep{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="dv-toast-host"></div>
<template id="tpl-portada">

<div style="width: 1440px; height: 810px; position: relative; overflow: hidden; box-sizing: border-box; background: #0450b8; color: #ffffff; font-family: 'Work Sans', system-ui, sans-serif">

  <img src="../img/fondo-fce-azul.jpg" alt="" style="position: absolute; left: 0; top: 0; width: 1440px; height: 810px; display: block">

  <div style="position: absolute; right: 30px; top: 16px; display: flex; align-items: center; gap: 18px">
    <img src="../img/sena-logo-blanco.svg" alt="SENA" style="height: 66px; width: auto">
    <span style="width: 1.5px; height: 58px; background: #ffffff"></span>
    <img src="../img/adecopria-h-blanco.png" alt="ADECOPRIA · Asociación de Educación Privada" style="height: 40px; width: auto">
    <img src="../img/gae-h-blanco.png" alt="Grupo AE Advanced Education" style="height: 26px; width: auto">
  </div>

  <section style="position: absolute; left: 30px; top: 108px; width: 440px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 14px; font-weight: 700; line-height: 1.35">DNSFT · Grupo de Gestión para la Productividad y Competitividad</span>
    <h1 style="margin: 16px 0 0; font-size: 60px; line-height: 1; font-weight: 800; letter-spacing: -1.8px">Plataforma virtual</h1>
    <span style="font-size: 19px; font-weight: 600; color: #d6e5ff">ADECOPRIA · Asociación de Educación Privada</span>

    <div style="margin-top: 18px; display: flex; gap: 12px">
      <div style="width: 256px; flex: none; box-sizing: border-box; padding: 18px; border-radius: 22px; background: #ffffff; color: #1d2125; display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 17px; font-weight: 700; color: #00304d">Un módulo a la vez</span>
        <div style="display: flex; gap: 8px">
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #0b51d7; color: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700">1</span>
          <span style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 12px; border: 2px solid #0b51d7; color: #0b51d7; display: flex; align-items: center; justify-content: center; font-weight: 700">2</span>
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #e9edf2; color: #6b7480; display: flex; align-items: center; justify-content: center; font-weight: 700">3</span>
          <span style="width: 40px; height: 40px; border-radius: 12px; background: #e9edf2; color: #6b7480; display: flex; align-items: center; justify-content: center; font-weight: 700">4</span>

        <span style="font-size: 13px; line-height: 1.45; color: #5b6570">Cada módulo se abre al terminar el anterior.</span>
      </div>
      <div style="flex-grow: 1; box-sizing: border-box; padding: 18px; border-radius: 22px; background: #39a900; color: #ffffff; display: flex; flex-direction: column; justify-content: space-between">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"></rect><path d="M16 10l5-3v10l-5-3"></path></svg>
        <span style="font-size: 19px; font-weight: 800; line-height: 1.15">Clases en vivo por Meet</span>
      </div>
    </div>

    <div style="margin-top: 8px; display: flex; flex-direction: column; gap: 6px">
      
      
      <div style="margin-top: 10px; display: flex; gap: 14px" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6"></circle></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h-2.5A3.5 3.5 0 0 0 9 6.5V10H6.5v3.5H9V21h3.5v-7.5H15l.5-3.5h-3V7a1 1 0 0 1 1-1H15z"></path></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4l16 16M20 4L4 20"></path></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="4"></rect><path d="M10 9.5v5l4.5-2.5z"></path></svg>
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 10.5V17M8 7.5v.01M12 17v-6.5M12 13.5c0-2 1.2-3 2.6-3s2.4 1 2.4 3V17"></path></svg>
      </div>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: 4px">@SENAComunica</span>
      <span style="font-size: 17px; font-weight: 700; letter-spacing: 4px">www.sena.edu.co</span>
    </div>

    <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.45; color: #e3ecff">
      <span><b style="color: #ffffff">Centro de Atención al Usuario:</b> [correo CAU] · WhatsApp [número] · Lun a vie [horario] · Sáb [horario]</span>
      <span style="display: flex; gap: 18px"><a href="#" data-act="soon" style="color: #ffffff; text-decoration: underline">Política de datos</a><a href="#" data-act="soon" style="color: #ffffff; text-decoration: underline">Manual de usuario</a><a href="#" data-act="soon" style="color: #ffffff; text-decoration: underline">App móvil</a></span>
    </div>
  </section>

  <div style="position: absolute; left: 0; top: 0; width: 1440px; height: 748px; overflow: hidden; -webkit-mask-image: linear-gradient(180deg, #000000 88%, transparent 100%); mask-image: linear-gradient(180deg, #000000 88%, transparent 100%)">
    <span style="position: absolute; left: 567.6px; top: 259.1px; width: 542.9px; height: 542.9px; box-sizing: border-box; border-radius: 50%; border: 79.2px solid #0a4bcb"></span>
    <img src="../img/pareja-fce.png" alt="Capacitador y participante de la formación" style="position: absolute; left: 500px; top: 160px; width: 600px; height: auto; display: block">
  </div>

  <section style="position: absolute; left: 1040px; top: 108px; width: 370px; box-sizing: border-box; padding: 24px 26px; border-radius: 24px; background: #ffffff; color: #1d2125; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 24px; font-weight: 800; letter-spacing: -0.4px; color: #00304d">Ingresa a la plataforma</span>
    <button type="button" data-act="google" style="height: 46px; display: flex; align-items: center; justify-content: center; gap: 12px; background: #ffffff; border: 1px solid #747775; border-radius: 999px; font-family: inherit; font-size: 15px; font-weight: 600; color: #1f1f1f; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path></svg>
      Continuar con Google
    </button>
    <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #5b6570"><span style="flex-grow: 1; height: 1px; background: #dde1e6"></span>o<span style="flex-grow: 1; height: 1px; background: #dde1e6"></span></div>
    <label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; color: #00304d">Número de documento
      <input type="text" placeholder="Ej. 1023456789" style="height: 46px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #b9c0c8; border-radius: 14px; font-family: inherit; font-size: 16px; background: #ffffff">
    </label>
    <label style="display: flex; flex-direction: column; gap: 5px; font-size: 14px; font-weight: 600; color: #00304d">Contraseña
      <input type="password" style="height: 46px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #b9c0c8; border-radius: 14px; font-family: inherit; font-size: 16px; background: #ffffff">
    </label>
    <button type="button" data-act="login" style="margin-top: 4px; height: 50px; border: none; border-radius: 999px; background: #0b51d7; color: #ffffff; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Ingresar</button>
    <a href="#" data-act="soon" style="align-self: center; font-size: 14px; font-weight: 600">¿Olvidaste tu contraseña?</a>
    <p style="margin: 2px 0 0; font-size: 12px; line-height: 1.45; color: #5b6570">En tu primer ingreso aceptarás la política de tratamiento de datos, la autorización de uso de imagen y la declaración de gratuidad.</p>
  </section>
</div>
</template>
<script>
window.THEME = {
  id: 'c', name: 'Opción C · Estudio AE', activityView: 'curso', inlineAI: true, hideActNav: true,
  afterComplete: (m, a, c) => c.nextAfter({ m, a }),   // flujo continuo: siguiente lección
  chrome: (c, inner) => (c.S.view === 'curso' ? inner : `<header class="c-top"><button class="c-brand" data-act="go" data-to="inicio" aria-label="Ir a Mis formaciones"><img src="../img/fce-lockup.jpg" alt="FCE · Formación Continua Especializada · Convocatoria DSNFT-0001-FCE-2026"></button>
    <nav><button data-act="go" data-to="inicio" class="${c.S.view === 'inicio' ? 'on' : ''}">Mis formaciones</button><button data-act="soon">Ayuda</button></nav>
    <div class="c-right"><img class="sena" src="../img/sena-logo.png" alt="SENA"><span class="c-sep"></span><img class="ade" src="../img/adecopria-h.png" alt="ADECOPRIA"><img class="gae" src="../img/gae-h.png" alt="Grupo AE Advanced Education"><span class="c-av">${c.U.nombres[0]}${c.U.apellidos[0]}</span></div></header><main>${inner}</main>`)
    // franja permanente exigida por el instructivo FCE 2026 (num. 3.1 A)
    + `<footer class="c-strip"><img class="fc" src="../img/formacion-continua.jpg" alt="#FORMACIÓNContinua"><span class="c-sep"></span><span>Las acciones de formación ejecutadas en el marco de la convocatoria DSNFT-0001-FCE-2026 son gratuitas para los trabajadores beneficiarios.</span><img class="m25" src="../img/mas25.jpg" alt="Más de 25 años"></footer>`,
  views: {
    curso: c => {
      const { S, C, ICON } = c, pct = c.progress(), done = c.allDone();
      const cur = S.cur || (done ? null : c.firstPending());
      const seg = C.modules.map((mo, i) => `<span title="Módulo ${i + 1}"><i style="width:${c.modCount(i) / mo.acts.length * 100}%"></i></span>`).join('');
      const rail = C.modules.map((mo, i) => { const cls = c.modDone(i) ? 'ok' : c.unlocked(i) ? 'cur' : '';
        return `<button class="${cls}" data-act="openModule" data-m="${i}" aria-label="Módulo ${i + 1}: ${mo.title}${cls === 'ok' ? ', completado' : cls ? ', en curso' : ', bloqueado'}">${cls === 'ok' ? ICON.check : cls ? i + 1 : ICON.lock}</button>`; }).join('');
      let main;
      if (!cur) main = `<div class="dv-celebrate">${ICON.award}</div><h1 class="dv-h1">Formación culminada</h1><p style="margin:0;color:#3c4043">Completaste los ${C.modules.length} módulos. Tu constancia está lista.</p><div class="dv-row"><button class="dv-btn dv-btn-pri" data-act="cert">${ICON.award} Ver certificado</button></div>`;
      else { const mo = C.modules[cur.m], p = c.prevBefore(cur), n = c.nextAfter(cur);
        main = `<div class="c-meta"><span>Módulo ${cur.m + 1} · ${mo.title}</span><span>·</span><span>Lección ${cur.a + 1} de ${mo.acts.length}</span><span class="dv-chip" style="margin-left:auto">${ICON.clock} ${c.daysLeft(cur.m)} días hábiles para terminar el módulo</span></div>
          ${c.activity(cur.m, cur.a)}
          <div class="c-nav">${p ? `<button class="dv-btn" data-act="prev">${ICON.left} Anterior</button>` : ''}${n && c.isDone(cur.m, cur.a) ? `<button class="dv-btn dv-btn-pri" style="margin-left:auto" data-act="next">Siguiente lección ${ICON.right}</button>` : `<span class="dv-muted" style="margin-left:auto;font-size:14px">${c.isDone(cur.m, cur.a) ? '' : 'Completa esta lección para avanzar.'}</span>`}</div>`; }
      const ai = S.aiInline;
      return `<div class="c-focus"><div class="c-bar"><button class="c-exit" data-act="go" data-to="inicio">${ICON.left}<span class="t">Salir del modo enfoque</span></button><img class="c-fce" src="../img/fce-lockup.jpg" alt="FCE · Formación Continua Especializada"><span class="c-name">${C.name}</span>
          <div class="c-seg" aria-label="Avance ${pct}%">${seg}<b style="margin-left:6px;color:#00304d">${pct}%</b></div><span class="c-logos"><img class="c-sena" src="../img/sena-logo.png" alt="SENA"><span class="c-sep"></span><img class="ade" src="../img/adecopria-h.png" alt="ADECOPRIA"><img class="gae" src="../img/gae-h.png" alt="Grupo AE Advanced Education"></span></div>
        <nav class="c-rail" aria-label="Módulos">${rail}<button class="book" data-act="about" aria-label="Sobre la formación">${ICON.book}</button></nav>
        <main class="c-main">${main}</main>
        <aside class="c-side">
          <div class="dv-card dv-stack c-ai"><span class="dv-h2">${ICON.spark} Asistente con IA</span>
            ${ai ? `<div id="ia-out" class="dv-ia" data-text="${c.esc(ai.text)}"></div>` : '<p class="dv-muted" style="margin:0">Pide un resumen de la lección o una explicación con un ejemplo de tu trabajo.</p>'}
            <div class="dv-row"><button class="dv-btn" data-act="ai" data-kind="resumen">Resumir</button><button class="dv-btn" data-act="ai" data-kind="explicar">Explicar</button></div>
            <span style="font-size:12.5px;color:#7a5c16">Respuestas de ejemplo. La IA apoya tu estudio: no califica ni reemplaza al capacitador.</span></div>
          <div class="dv-card dv-stack"><span class="dv-kicker">Próxima sesión en vivo</span><span class="dv-h2">Hora de dudas con el capacitador</span><span class="dv-muted">${c.fmt(c.liveDate())} · 6:00 p. m. · Google Meet</span>
            <button class="dv-btn dv-btn-pri" data-act="live">${ICON.video} ${S.live ? 'Asistencia registrada' : 'Unirme'}</button></div>
          ${done ? `<button class="dv-btn dv-btn-pri" data-act="cert">${ICON.award} Ver certificado</button>` : ''}
        </aside></div>`;
    }
  }
};
</script>
<script src="demo.js"></script>
</body>
</html>
